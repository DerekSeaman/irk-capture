---
name: Professional Linting

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1. YAML Linter
      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "."
          config_file: ".yamllint"

      # 2. C++ Format Check
      - name: Install clang-format-18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18

      - name: C++ Format Check
        run: |
          find components -name '*.cpp' -o -name '*.h' | \
            xargs clang-format-18 --style=file --dry-run --Werror

      # 3. Python Lint
      - name: Python Lint
        uses: psf/black@stable
        with:
          options: "--check --verbose"
          src: "./components"

      # 4. Markdown Lint
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          # Lints all .md files in the repo. Do NOT auto-fix: with fix enabled,
          # fixable violations are silently corrected in the ephemeral checkout
          # (never committed) and CI passes green, hiding real problems.
          globs: "**/*.md"

  # identity_name.h is free of ESP-IDF includes so the name a Refresh BLE
  # Identity press adopts can be asserted on the host, where a wrong suffix or
  # an over-length name is visible without flashing anything.
  host-tests:
    name: Host Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Generate tests
        run: |
          cat > "${RUNNER_TEMP}/identity_name_test.cpp" <<'EOF'
          #include "identity_name.h"
          #include <cassert>
          #include <cstdio>

          using namespace esphome::irk_capture;

          int main() {
            // The suffix is the address's low two octets, upper-case, so it can
            // be read straight off the end of the Effective MAC sensor.
            assert(identity_name("HR", 0x7F, 0x3A) == "IRK HR 7F3A");
            assert(identity_name("HR", 0x00, 0x00) == "IRK HR 0000");
            assert(identity_name("HR", 0xFF, 0xFF) == "IRK HR FFFF");
            // Nibble order: a swap here would print a suffix that never matches.
            assert(identity_name("HR", 0xAB, 0xCD) == "IRK HR ABCD");
            assert(identity_name("KB", 0x12, 0x34) == "IRK KB 1234");

            // Names must fit the advertised-name cap without relying on
            // sanitize_ble_name() to truncate them.
            assert(identity_name("HR", 0xFF, 0xFF).size() <= BLE_NAME_MAX_LEN);
            assert(identity_name("KB", 0xFF, 0xFF).size() <= BLE_NAME_MAX_LEN);
            // ... including for an abbreviation a future profile gets wrong.
            assert(identity_name("LONGER", 0x7F, 0x3A) == "IRK LO 7F3A");
            assert(identity_name("LONGER", 0x7F, 0x3A).size() <= BLE_NAME_MAX_LEN);
            assert(identity_name(nullptr, 0x7F, 0x3A).size() <= BLE_NAME_MAX_LEN);

            printf("identity_name: all assertions passed\n");
            return 0;
          }
          EOF
      - name: Build and run
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I components/irk_capture \
            "${RUNNER_TEMP}/identity_name_test.cpp" -o "${RUNNER_TEMP}/identity_name_test"
          "${RUNNER_TEMP}/identity_name_test"

  # Compile the component so C++ API drift, invalid code generation, or ESP-IDF
  # incompatibility fail CI (config/lint checks alone cannot catch these).
  compile:
    name: ESPHome Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum / ESP32
            esphome: esphome==2026.7.4
            board: esp32dev
            variant: esp32
          - name: latest / ESP32
            esphome: esphome
            board: esp32dev
            variant: esp32
          - name: latest / ESP32-C3
            esphome: esphome
            board: esp32-c3-devkitm-1
            variant: esp32c3
          - name: latest / ESP32-C6
            esphome: esphome
            board: esp32-c6-devkitc-1
            variant: esp32c6
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install "${{ matrix.esphome }}"

      # The compile config is generated here rather than committed, so the repo
      # tree stays free of test scaffolding. It pulls the component from the
      # checkout (external_components: local) and exercises every entity platform.
      - name: Generate test configuration
        run: |
          cat > "${RUNNER_TEMP}/irk-capture-ci.yaml" <<'EOF'
          esphome:
            name: irk-capture-ci
          esp32:
            board: ${{ matrix.board }}
            variant: ${{ matrix.variant }}
            framework:
              type: esp-idf
          logger:
          external_components:
            - source:
                type: local
                path: ${{ github.workspace }}/components
              components: [irk_capture]
          irk_capture:
            id: irk
            ble_name: "IRK Test"
          text_sensor:
            - platform: irk_capture
              irk_capture_id: irk
              last_irk:
                name: "IRK"
              last_address:
                name: "Device MAC"
              effective_mac:
                name: "Effective MAC"
              status:
                name: "Status"
          switch:
            - platform: irk_capture
              irk_capture_id: irk
              advertising:
                name: "BLE Advertising"
              stop_after_capture:
                name: "Stop Advertising After Capture"
          button:
            - platform: irk_capture
              irk_capture_id: irk
              refresh_identity:
                name: "Refresh BLE Identity"
              forget_bonds:
                name: "Forget All Bonds"
          text:
            - platform: irk_capture
              irk_capture_id: irk
              ble_name:
                name: "BLE Device Name"
                mode: text
              next_capture_label:
                name: "Next Capture Label"
                mode: text
          select:
            - platform: irk_capture
              irk_capture_id: irk
              ble_profile:
                name: "BLE Profile"
          EOF

      - name: Compile
        run: esphome compile "${RUNNER_TEMP}/irk-capture-ci.yaml"
