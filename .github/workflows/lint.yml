---
name: Professional Linting

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1. YAML Linter
      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "."
          config_file: ".yamllint"

      # 2. C++ Format Check
      - name: Install clang-format-18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18

      - name: C++ Format Check
        run: |
          find components -name '*.cpp' -o -name '*.h' | \
            xargs clang-format-18 --style=file --dry-run --Werror

      # 3. Python Lint
      - name: Python Lint
        uses: psf/black@stable
        with:
          options: "--check --verbose"
          src: "./components"

      # 4. Markdown Lint
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          # Lints all .md files in the repo. Do NOT auto-fix: with fix enabled,
          # fixable violations are silently corrected in the ephemeral checkout
          # (never committed) and CI passes green, hiding real problems.
          globs: "**/*.md"

  # Compile the component so C++ API drift, invalid code generation, or ESP-IDF
  # incompatibility fail CI (config/lint checks alone cannot catch these).
  compile:
    name: ESPHome Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum / ESP32
            esphome: esphome==2026.7.4
            board: esp32dev
            variant: esp32
          - name: latest / ESP32
            esphome: esphome
            board: esp32dev
            variant: esp32
          - name: latest / ESP32-C3
            esphome: esphome
            board: esp32-c3-devkitm-1
            variant: esp32c3
          - name: latest / ESP32-C6
            esphome: esphome
            board: esp32-c6-devkitc-1
            variant: esp32c6
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install "${{ matrix.esphome }}"

      # The compile config is generated here rather than committed, so the repo
      # tree stays free of test scaffolding. It pulls the component from the
      # checkout (external_components: local) and exercises every entity platform.
      - name: Generate test configuration
        run: |
          cat > "${RUNNER_TEMP}/irk-capture-ci.yaml" <<'EOF'
          esphome:
            name: irk-capture-ci
          esp32:
            board: ${{ matrix.board }}
            variant: ${{ matrix.variant }}
            framework:
              type: esp-idf
          logger:
          external_components:
            - source:
                type: local
                path: ${{ github.workspace }}/components
              components: [irk_capture]
          irk_capture:
            id: irk
            ble_name: "IRK Test"
          text_sensor:
            - platform: irk_capture
              irk_capture_id: irk
              last_irk:
                name: "IRK"
              last_address:
                name: "Device MAC"
              effective_mac:
                name: "Effective MAC"
          switch:
            - platform: irk_capture
              irk_capture_id: irk
              advertising:
                name: "BLE Advertising"
          button:
            - platform: irk_capture
              irk_capture_id: irk
              new_mac:
                name: "Generate New MAC"
          text:
            - platform: irk_capture
              irk_capture_id: irk
              ble_name:
                name: "BLE Device Name"
                mode: text
          select:
            - platform: irk_capture
              irk_capture_id: irk
              ble_profile:
                name: "BLE Profile"
          EOF

      - name: Compile
        run: esphome compile "${RUNNER_TEMP}/irk-capture-ci.yaml"
