---
name: Professional Linting

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1. YAML Linter
      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "."
          config_file: ".yamllint"

      # 2. C++ Format Check
      - name: Install clang-format-18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18

      - name: C++ Format Check
        run: |
          find components -name '*.cpp' -o -name '*.h' | \
            xargs clang-format-18 --style=file --dry-run --Werror

      # 3. Python Lint
      - name: Python Lint
        uses: psf/black@stable
        with:
          options: "--check --verbose"
          src: "./components"

      # 4. Markdown Lint
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          # Lints all .md files in the repo. Do NOT auto-fix: with fix enabled,
          # fixable violations are silently corrected in the ephemeral checkout
          # (never committed) and CI passes green, hiding real problems.
          globs: "**/*.md"

  # Compile the component so C++ API drift, invalid code generation, or ESP-IDF
  # incompatibility fail CI (config/lint checks alone cannot catch these).
  compile:
    name: ESPHome Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum / ESP32
            esphome: esphome==2026.7.4
            config: tests/test-irk-capture.yaml
          - name: latest / ESP32
            esphome: esphome
            config: tests/test-irk-capture.yaml
          - name: latest / ESP32-C3
            esphome: esphome
            config: tests/test-irk-capture-esp32-c3.yaml
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install "${{ matrix.esphome }}"

      - name: Compile test configuration
        run: esphome compile "${{ matrix.config }}"
