---
# Generic ESP32 IRK Capture Package
# This package provides IRK capture functionality for ESP32 devices
# Intended to be added as a `packages:` entry to an ESPHome Device Builder-generated
# device YAML. The device YAML must already provide: esphome.name, esphome.friendly_name,
# esp32.variant (+ flash_size/board), api.encryption.key, ota password, and
# wifi.ssid/password/ap. This package supplies everything else.

esphome:
  # Log the station MAC before Wi-Fi setup so AP-side authentication failures
  # can be correlated even when the device never connects.
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            const auto wifi_mac = get_mac_address_pretty();
            ESP_LOGI("wifi", "WiFi STA MAC: %s", wifi_mac.c_str());

esp32:
  # NimBLE stack with ESP-IDF. Supports all ESP32 variants (ESP32, C3, C6, S3, etc.)
  # board/variant come from the device YAML.
  # NOTE: All Bluetooth/NimBLE sdkconfig options are set by the irk_capture
  # component itself (components/irk_capture/__init__.py) and are the single
  # source of truth. Do NOT re-declare them here: the component applies its
  # values after the esp32 platform, so any values set here would be silently
  # overridden.
  framework:
    type: esp-idf
    version: recommended

# esphome.name / friendly_name come from the device YAML. No esphome.project is
# set here on purpose: a hardcoded project version shows as a stale firmware
# version in Home Assistant, and this component tracks main rather than releases.

# IMPORTANT: Do NOT include esp32_ble:, esp32_ble_tracker:, or bluetooth_proxy: here.
# The irk_capture component fully initializes and manages NimBLE itself.

logger:
  level: DEBUG
  baud_rate: 115200

api:
  # encryption.key comes from the device YAML.
  reboot_timeout: 15min

# ota: is owned entirely by the device YAML. Package `packages:` merges lists by
# concatenation (not override), so defining an `ota:` entry here would duplicate
# the device YAML's OTA platform instead of extending it.

wifi:
  # ssid/password/ap.ssid/ap.password come from the device YAML.
  power_save_mode: NONE
  fast_connect: true
  enable_on_boot: true
  reboot_timeout: 10min
  ap:
    ap_timeout: 120s
  on_disconnect:
    then:
      - lambda: |-
          id(_wifi_disconnects_since_boot)++;

# captive_portal: is enabled by the device YAML.

mdns:

# Pull irk_capture external component. The component always tracks main so
# devices pick up the latest component fixes automatically; the package YAML
# version is pinned separately via the device YAML's packages: ref.
external_components:
  - source:
      type: git
      url: https://github.com/DerekSeaman/irk-capture
      ref: main
    components: [irk_capture]
    refresh: always

# Configure the custom IRK capture component
irk_capture:
  id: irk
  ble_name: "IRK Capture"
  start_on_boot: true
  continuous_mode: true
  max_captures: 10

# Text sensors for Wi-Fi info and IRK capture
text_sensor:
  - platform: wifi_info
    bssid:
      name: "BSSID"
      entity_category: diagnostic
    ip_address:
      name: "IP"
      entity_category: diagnostic
    mac_address:
      name: "MAC"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic

  - platform: irk_capture
    irk_capture_id: irk
    last_irk:
      name: "IRK"
      id: last_irk
    last_address:
      name: "Device MAC"
      id: last_addr
    effective_mac:
      name: "Effective MAC"
      id: effective_mac

# Persistent BLE advertising intent (pauses automatically while connected)
switch:
  - platform: irk_capture
    irk_capture_id: irk
    advertising:
      id: ble_advertising
      name: "BLE Advertising"
      restore_mode: ALWAYS_ON

# Buttons
button:
  - platform: irk_capture
    irk_capture_id: irk
    new_mac:
      id: new_mac_btn
      name: "Generate New MAC"
  - platform: restart
    name: "Restart Device"

# Text input to change the BLE name dynamically
text:
  - platform: irk_capture
    irk_capture_id: irk
    ble_name:
      id: ble_name_input
      name: "BLE Device Name"
      mode: text

# BLE profile selection dropdown
select:
  - platform: irk_capture
    irk_capture_id: irk
    ble_profile:
      id: ble_profile_select
      name: "BLE Profile"
      # Options: "Heart Sensor" or "Keyboard" (default set in code)

# Diagnostics and basics
sensor:
  - platform: uptime
    name: "Uptime"
    unit_of_measurement: "h"
    accuracy_decimals: 2
    update_interval: 60s
    filters:
      - lambda: return x / 3600.0;

  - platform: internal_temperature
    name: "Internal Temp"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 30s
    entity_category: diagnostic

  - platform: template
    name: "Wi-Fi Disconnects (since boot)"
    id: wifi_disconnects_since_boot_sensor
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return id(_wifi_disconnects_since_boot);

# Since-boot only; not restored across reboots
globals:
  - id: _wifi_disconnects_since_boot
    type: int
    restore_value: no
    initial_value: '0'

time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
