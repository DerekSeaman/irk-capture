---
# Generic ESP32 IRK Capture Package
# Intended to be added as a `packages:` entry to an ESPHome Device Builder-generated
# device YAML. The device YAML must already provide: esphome.name, esphome.friendly_name,
# esp32.variant (+ flash_size/board), api.encryption.key, ota encryption or password,
# and wifi.ssid/password/ap. This package supplies everything else.

esphome:
  # Log the station MAC before Wi-Fi setup so AP-side authentication failures
  # can be correlated even when the device never connects.
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            const auto wifi_mac = get_mac_address_pretty();
            ESP_LOGI("wifi", "WiFi STA MAC: %s", wifi_mac.c_str());

esp32:
  # The device YAML selects an ESP32 board with BLE and usable Wi-Fi.
  # This package uses ESP-IDF/NimBLE. CI builds ESP32, C3, C6, and S3 on
  # ESP-IDF 5.x and 6.x.
  # Do NOT declare Bluetooth/NimBLE sdkconfig_options here:
  # components/irk_capture/__init__.py sets them afterwards and wins.
  framework:
    type: esp-idf
    version: recommended

# esphome.name / friendly_name come from the device YAML. No esphome.project is
# set here on purpose: a hardcoded project version shows as a stale firmware
# version in Home Assistant, and this component tracks main rather than releases.

# IMPORTANT: Do NOT include esp32_ble:, esp32_ble_tracker:, or bluetooth_proxy: here.
# The irk_capture component fully initializes and manages NimBLE itself.

logger:
  level: DEBUG
  baud_rate: 115200
  # Bluetooth events log from the NimBLE task in bursts of a dozen lines. The
  # 768-byte default drops the last lines of a capture from the network log.
  task_log_buffer_size: 2048

api:
  # encryption.key comes from the device YAML.
  # 0s: never restart for lack of a client. Without this, a device used through
  # the wizard alone restarts every 15 minutes and loses its session.
  reboot_timeout: 0s

# ota: is owned entirely by the device YAML. Package `packages:` merges lists by
# concatenation (not override), so defining an `ota:` entry here would duplicate
# the device YAML's OTA platform instead of extending it.

wifi:
  # ssid/password/ap.ssid/ap.password come from the device YAML.
  power_save_mode: NONE
  fast_connect: true
  enable_on_boot: true
  reboot_timeout: 10min
  ap:
    ap_timeout: 120s
  on_disconnect:
    then:
      - lambda: |-
          id(_wifi_disconnects_since_boot)++;

# captive_portal: is enabled by the device YAML.

mdns:

# Pull irk_capture from main by default; override irk_component_url /
# irk_component_ref in the device YAML's substitutions to test a fork or
# branch without editing this package (device substitutions win).
# When testing a branch, match irk_component_ref to your packages: ref so
# package options do not outrun the component schema.
substitutions:
  irk_component_url: https://github.com/DerekSeaman/irk-capture
  irk_component_ref: main

external_components:
  - source:
      type: git
      url: ${irk_component_url}
      ref: ${irk_component_ref}
    components: [irk_capture]
    refresh: always

irk_capture:
  id: irk
  ble_name: "IRK Capture"
  start_on_boot: true
  continuous_mode: true
  max_captures: 10
  # Fires a Home Assistant event (esphome.irk_captured) once per capture. In HA,
  # enable "Allow the device to perform Home Assistant actions" for this device.
  on_capture:
    - homeassistant.event:
        event: esphome.irk_captured
        data:
          irk: !lambda "return irk;"
          mac: !lambda "return mac;"
          verification: !lambda "return verification;"

text_sensor:
  - platform: wifi_info
    bssid:
      name: "BSSID"
      entity_category: diagnostic
    ip_address:
      name: "IP"
      entity_category: diagnostic
    mac_address:
      name: "MAC"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic

  - platform: irk_capture
    irk_capture_id: irk
    last_irk:
      name: "IRK"
      id: last_irk
    last_address:
      name: "Device BLE MAC"
      id: last_addr
    irk_check:
      name: "IRK Check"
      id: irk_check
      icon: mdi:shield-check
    effective_mac:
      name: "ESP32 BLE MAC"
      id: effective_mac
    status:
      name: "Status"
      id: capture_status
      icon: mdi:bluetooth-connect

# Persistent BLE advertising intent (pauses automatically while connected)
switch:
  - platform: irk_capture
    irk_capture_id: irk
    advertising:
      id: ble_advertising
      name: "BLE Advertising"
      # Preserve start_on_boot; an explicit restore mode can override it.
      restore_mode: DISABLED

button:
  - platform: irk_capture
    irk_capture_id: irk
    refresh_identity:
      id: refresh_identity_btn
      name: "Refresh BLE Identity"
      icon: mdi:bluetooth-settings
  - platform: restart
    name: "Restart Device"

text:
  - platform: irk_capture
    irk_capture_id: irk
    ble_name:
      id: ble_name_input
      name: "BLE Device Name"
      mode: text

select:
  - platform: irk_capture
    irk_capture_id: irk
    ble_profile:
      id: ble_profile_select
      name: "BLE Profile"
      # Options: "Heart Sensor" or "Keyboard" (default set in code)

sensor:
  - platform: uptime
    name: "Uptime"
    unit_of_measurement: "h"
    accuracy_decimals: 2
    update_interval: 60s
    filters:
      - lambda: return x / 3600.0;

  - platform: internal_temperature
    name: "Internal Temp"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 30s
    entity_category: diagnostic

  - platform: template
    name: "Wi-Fi Disconnects (since boot)"
    id: wifi_disconnects_since_boot_sensor
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      return id(_wifi_disconnects_since_boot);

globals:
  - id: _wifi_disconnects_since_boot
    type: int
    restore_value: no
    initial_value: '0'

time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
