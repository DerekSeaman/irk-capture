# Minimal configuration used by CI to compile the local irk_capture component.
# Exercises every platform (text_sensor/switch/button/text/select) so C++ API
# drift, invalid code generation, or ESP-IDF incompatibility fail the build.
esphome:
  name: irk-capture-test

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [irk_capture]

irk_capture:
  id: irk
  ble_name: "IRK Test"

text_sensor:
  - platform: irk_capture
    irk_capture_id: irk
    last_irk:
      name: "IRK"
    last_address:
      name: "Device MAC"
    effective_mac:
      name: "Effective MAC"

switch:
  - platform: irk_capture
    irk_capture_id: irk
    advertising:
      name: "BLE Advertising"

button:
  - platform: irk_capture
    irk_capture_id: irk
    new_mac:
      name: "Generate New MAC"

text:
  - platform: irk_capture
    irk_capture_id: irk
    ble_name:
      name: "BLE Device Name"
      mode: text

select:
  - platform: irk_capture
    irk_capture_id: irk
    ble_profile:
      name: "BLE Profile"
